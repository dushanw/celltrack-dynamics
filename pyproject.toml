[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celltrack-dynamics"
version = "0.1.0"
description = "Label-free cell tracking and state-transition analysis for low-frame-rate time-lapse microscopy"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Dushan Wadduwage" }]
keywords = ["cell tracking", "time-lapse microscopy", "Cellpose", "HOCT", "Trackastra", "state transitions"]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "zarr>=3.0",
    "dask>=2024.8",
    "tifffile>=2024.8",
    "imageio>=2.35",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "tqdm>=4.66",
    "numba>=0.60",
    "torch>=2.4",
    "torchvision>=0.19",
    "cellpose>=4.2",
    "trackastra>=0.5",
    "hoct>=0.3",
    "laptrack>=0.17",
    "motile>=1.0",
    "traccuracy>=0.4",
    "geff>=1.3",
]

[project.optional-dependencies]
view = ["napari[pyqt6]>=0.5"]      # interactive viewer (python -m celltrack.view napari)
cluster = ["gdown>=5"]             # Google Drive download on the HPC login node

[project.urls]
Repository = "https://github.com/dushanw/celltrack-dynamics"

[tool.setuptools]
packages = ["celltrack"]
