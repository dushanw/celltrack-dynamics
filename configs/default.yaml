# Default configuration (local run). Paths are resolved relative to this file's directory.
# All lengths are in pixels and all times in frames unless stated otherwise.

paths:
  raw_tif: ../data/well_A1_stack.tif
  out_dir: ../outputs
  raw_zarr: ../outputs/raw.zarr          # (T, Y, X) uint8, chunks (1, 1024, 1024)
  flat_zarr: ../outputs/flat.zarr        # background-flattened copy used for segmentation
  background: ../outputs/background.npy  # per-pixel temporal median
  bubble_mask: ../outputs/bubble_mask.npy
  masks_zarr: ../outputs/masks.zarr      # (T, Y, X) uint16 instance labels
  detections: ../outputs/detections.parquet
  debris: ../outputs/debris.parquet
  tracks_dir: ../outputs/tracks
  analysis_dir: ../outputs/analysis
  qc_dir: ../outputs/qc

acquisition:
  frame_interval_min: 2.5             # minutes between frames (user supplied)
  pixel_size_um: 0.5                  # MCAM, 0.3 NA (~10x), 1.2 um resolution (J. Brake, Oct 2026)
  n_frames: 576
  shape_yx: [3072, 3072]

ingest:
  chunk_yx: [1024, 1024]
  background_n_frames: 48             # frames sampled for the temporal median

segmentation:
  model: cpsam_v2
  device: mps
  downsample: 1                       # 1 = full resolution, 2 = 2x downsample (chosen in Phase 1 test)
  flow_threshold: 0.4
  cellprob_threshold: 0.0
  split_concave: true                 # watershed-split large concave masks (touching cells merged by Cellpose)
  split_area_factor: 1.3              # candidate if area > factor * median area in the frame
  split_solidity_max: 0.88            # ... and solidity below this
  min_area_px: 120                    # objects smaller than this go to the debris table
  max_area_px: 6000
  border_margin_px: 40                # distance from frame edge treated as "border"
  bubble_dilate_px: 15

tracking:
  primary: hoct                       # chosen after the 113-frame comparison: ~2.5x fewer tracklet breaks than Trackastra
  chunk_frames: 24                    # full movie is linked in overlapping chunks (cached under outputs/tracks/chunks)
  trackastra:
    model: general_2d
    mode: ilp_nodiv                   # greedy | greedy_nodiv | ilp | ilp_nodiv (1-to-1; divisions decided in refine.py)
    delta_t: 2                        # candidate edges across up to 1 missing frame (ILP gap closing)
    ilp_chunk: 12                     # frames per ILP chunk
    device: mps
  laptrack:
    max_distance: 45
    gap_closing_max_frame_count: 2
    splitting_max_distance: 45
  hoct:
    enabled: true
  high_confidence_prob: 0.5           # edge probability threshold for the high-confidence subset

states:
  speed_thresholds_px_per_frame: null # null = fitted automatically from the step-speed distribution
  cluster_min_neighbours: 2
  cluster_min_frames: 2
  division_window_frames: 2
  merge_split:                        # repair of under-segmentation merge/split artifacts (refine.py)
    gap_frames: 3                     # a track may end up to this many frames before the merged object appears
    min_merged_area_ratio: 1.25       # merged object must be at least this much larger than the absorbed cell
    max_merged_frames: 12             # longest merged tracklet that is still repaired
  division:                           # biological-division confirmation (see states.confirm_divisions)
    min_parent_frames: 4
    max_daughter_frac: 0.8
    max_daughter_rel_median: 0.85
    min_daughter_frames: 2
    max_daughter_step_px: 45          # search radius for the mother of an orphan daughter
    min_mother_circularity: 0.75      # mitotic rounding
    min_mother_rel_median: 0.9        # mother area vs frame median
    max_daughter_separation_factor: 2.5   # daughters' centre distance <= factor * sqrt(mean daughter area)
    max_mother_rel_median: 2.2        # larger "mothers" are merged clusters
    min_daughter_rel_median: 0.45     # smaller "daughters" are debris / apoptotic bodies
    area_conservation_tol: 0.35       # |A_d1 + A_d2 - A_m| <= tol * A_m
  death_lookback_frames: 6
  death_min_score: 3                  # of 5 signatures (shrink, bright, still, round, debris); "still" is mandatory
  death_min_nn_dist_px: 45            # and the cell must be isolated (no touching neighbour, NN further than this)
  lags: [1, 4, 12]
  time_window_hours: 6
  bootstrap_n: 200
